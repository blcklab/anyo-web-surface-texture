<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anyo Game Boy Monitor Texture Proof</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body, #world { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111318; }
      #world { display: block; touch-action: none; }
      aside { position: fixed; inset: 16px auto auto 16px; z-index: 10; max-width: 420px; padding: 12px 14px; border: 1px solid rgba(255,255,255,.14); border-radius: 12px; background: rgba(12,14,18,.82); color: #e5e7eb; backdrop-filter: blur(14px); }
      aside strong { display: block; color: white; margin-bottom: 5px; }
      aside p { margin: 0; font-size: 13px; line-height: 1.45; }
    </style>
  </head>
  <body>
    <canvas id="world" aria-label="Game Boy framebuffer rendered on an Anyo monitor"></canvas>
    <aside>
      <strong>WS4 monitor proof</strong>
      <p>The 160×144 host framebuffer is a depth-tested Sekai64 texture. This fixture intentionally has no keyboard, gamepad, audio, or UV input.</p>
    </aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
